<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Login to your zerøbyte account">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%237c3aed'/%3E%3Ctext x='96' y='130' font-size='75' text-anchor='middle' fill='white' font-weight='bold'%3EZB%3C/text%3E%3C/svg%3E">
  <title>zerøbyte | Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 45px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.5s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      display: block;
    }
    h2 { text-align: center; margin-bottom: 10px; color: #cbd5e1; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
    label i { margin-right: 8px; color: #7c3aed; }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #7c3aed; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(124,58,237,0.4); }
    .signup-link { text-align: center; margin-top: 25px; color: #94a3b8; }
    .signup-link a { color: #7c3aed; text-decoration: none; }
    .message { padding: 14px; border-radius: 12px; margin-bottom: 25px; text-align: center; }
    .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
    .success { background: rgba(34,197,94,0.2); border: 1px solid #22c55e; color: #22c55e; }
    @media (max-width: 640px) { .login-container { padding: 30px 25px; } }
  </style>
</head>
<body>
  <div class="login-container">
    <a href="index.html" class="logo">zerøbyte<span style="color:#22c55e">.</span></a>
    <h2>Welcome Back</h2>
    <div class="subtitle">Sign in to continue</div>
    <div id="message"></div>
    <form id="loginForm">
      <div class="form-group"><label><i class="fas fa-envelope"></i> Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label><i class="fas fa-lock"></i> Password</label><input type="password" id="password" required></div>
      <button type="submit" class="btn-primary">Login</button>
    </form>
    <div class="signup-link">Don't have an account? <a href="signup.html">Sign Up</a></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const messageDiv = document.getElementById('message');
    function showMessage(text, type) { messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`; setTimeout(() => messageDiv.innerHTML = '', 5000); }
    _supabase.auth.getSession().then(({ data: { session } }) => { if (session) window.location.href = 'home.html'; });
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await _supabase.from('profiles').update({ is_online: true }).eq('id', data.user.id);
        showMessage('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          _supabase.from('profiles').select('is_admin').eq('id', data.user.id).single().then(({ data: profile }) => {
            window.location.href = profile?.is_admin ? 'admin/dashboard.html' : 'home.html';
          });
        }, 1000);
      } catch (error) { showMessage(error.message, 'error'); }
    });
  </script>
</body>
</html>
