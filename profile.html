<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Manage your zerøbyte profile - Update avatar, bio, location and account settings.">
  <meta name="robots" content="noindex, nofollow">
  <title>zerøbyte | Edit Profile - Manage Your Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #ffffff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 85px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }

    .back-btn {
      background: rgba(124, 58, 237, 0.2);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #7c3aed;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: #7c3aed;
      color: white;
      transform: scale(1.05);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Profile Section */
    .profile-section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 25px;
    }

    .avatar-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar-preview {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .avatar-preview:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 35px rgba(124, 58, 237, 0.3);
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-preview i {
      font-size: 52px;
    }

    .avatar-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px;
      font-size: 12px;
      text-align: center;
    }

    .avatar-input {
      display: none;
    }

    .change-avatar-btn {
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid #7c3aed;
      color: #7c3aed;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      display: inline-block;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .change-avatar-btn:hover {
      background: #7c3aed;
      color: white;
    }

    /* Form */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
    }

    label i {
      margin-right: 8px;
      color: #7c3aed;
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Preview Section */
    .preview-section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px;
    }

    .preview-section h3 {
      margin-bottom: 20px;
      color: #cbd5e1;
      font-size: 18px;
    }

    .preview-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(124, 58, 237, 0.2);
    }

    .preview-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .preview-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .preview-info h4 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .preview-info p {
      font-size: 13px;
      color: #94a3b8;
    }

    .preview-bio {
      color: #94a3b8;
      margin: 15px 0;
      line-height: 1.5;
    }

    .preview-location {
      font-size: 13px;
      color: #64748b;
    }

    .preview-location i {
      margin-right: 6px;
      color: #7c3aed;
    }

    /* Message */
    .message {
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: center;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .info {
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid #7c3aed;
      color: #7c3aed;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 12px 20px;
      border-top: 1px solid rgba(124, 58, 237, 0.2);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      transition: color 0.3s ease;
      cursor: pointer;
      padding: 5px 15px;
      border-radius: 10px;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item:hover, .nav-item.active {
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.1);
    }

    @media (max-width: 640px) {
      .container {
        padding: 15px;
        padding-bottom: 80px;
      }
      
      .profile-section, .preview-section {
        padding: 20px;
      }
      
      .avatar-preview {
        width: 100px;
        height: 100px;
      }
      
      .avatar-preview i {
        font-size: 40px;
      }
      
      .preview-header {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="logo">Edit Profile</div>
    </div>

    <div id="messageContainer"></div>

    <div class="profile-section">
      <div class="avatar-section">
        <div class="avatar-preview" onclick="document.getElementById('avatarInput').click()">
          <i class="fas fa-user" id="avatarIcon"></i>
          <img id="avatarImg" style="display:none">
          <div class="avatar-overlay"><i class="fas fa-camera"></i> Change</div>
        </div>
        <input type="file" id="avatarInput" class="avatar-input" accept="image/jpeg, image/png, image/gif">
        <div>
          <button class="change-avatar-btn" onclick="document.getElementById('avatarInput').click()">
            <i class="fas fa-upload"></i> Upload New Avatar
          </button>
        </div>
        <p style="font-size: 11px; color: #64748b; margin-top: 12px;">Recommended: Square image, max 2MB</p>
      </div>

      <form id="profileForm">
        <div class="form-group">
          <label><i class="fas fa-user-circle"></i> Display Name</label>
          <input type="text" id="displayName" placeholder="How should people call you?" required>
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-at"></i> Username</label>
          <input type="text" id="username" placeholder="coolusername" required>
          <div style="font-size: 11px; color: #64748b; margin-top: 5px;">Only lowercase letters, numbers, and underscores</div>
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-align-left"></i> Bio</label>
          <textarea id="bio" placeholder="Tell the world about yourself..."></textarea>
          <div style="font-size: 11px; color: #64748b; margin-top: 5px;">Max 150 characters</div>
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-map-marker-alt"></i> Location</label>
          <input type="text" id="location" placeholder="City, Country">
        </div>
        
        <button type="submit" class="btn-primary" id="saveBtn">
          <i class="fas fa-save"></i> Save Changes
        </button>
      </form>
    </div>

    <div class="preview-section">
      <h3><i class="fas fa-eye"></i> Profile Preview</h3>
      <div class="preview-card" id="previewCard">
        <div class="preview-header">
          <div class="preview-avatar" id="previewAvatarContainer">
            <i class="fas fa-user" id="previewAvatarIcon"></i>
            <img id="previewAvatarImg" style="display:none; width:100%; height:100%; border-radius:50%; object-fit:cover">
          </div>
          <div class="preview-info">
            <h4 id="previewName">Your Name</h4>
            <p id="previewHandle">@username</p>
          </div>
        </div>
        <div class="preview-bio" id="previewBio">
          <i class="fas fa-quote-left"></i> Your bio will appear here
        </div>
        <div class="preview-location" id="previewLocation">
          <i class="fas fa-map-marker-alt"></i> <span>Location not set</span>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='home.html'">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </div>
      <div class="nav-item active" onclick="window.location.href='profile.html'">
        <i class="fas fa-user-edit"></i>
        <span>Profile</span>
      </div>
      <div class="nav-item" onclick="window.location.href='search.html'">
        <i class="fas fa-search"></i>
        <span>Find</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let currentAvatarUrl = null;

    function showMessage(text, type) {
      const container = document.getElementById('messageContainer');
      container.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return null;
      }
      currentUser = session.user;
      return currentUser;
    }

    async function loadProfile() {
      const { data } = await _supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      
      if (data) {
        document.getElementById('displayName').value = data.display_name || '';
        document.getElementById('username').value = data.username || '';
        document.getElementById('bio').value = data.bio || '';
        document.getElementById('location').value = data.location || '';
        
        if (data.avatar_url) {
          currentAvatarUrl = data.avatar_url;
          document.getElementById('avatarImg').src = data.avatar_url;
          document.getElementById('avatarImg').style.display = 'block';
          document.getElementById('avatarIcon').style.display = 'none';
          
          document.getElementById('previewAvatarImg').src = data.avatar_url;
          document.getElementById('previewAvatarImg').style.display = 'block';
          document.getElementById('previewAvatarIcon').style.display = 'none';
        }
        
        updatePreview();
      }
    }

    function updatePreview() {
      const displayName = document.getElementById('displayName').value || 'Your Name';
      const username = document.getElementById('username').value || 'username';
      const bio = document.getElementById('bio').value || 'Your bio will appear here';
      const location = document.getElementById('location').value || 'Location not set';
      
      document.getElementById('previewName').textContent = displayName;
      document.getElementById('previewHandle').textContent = `@${username.toLowerCase()}`;
      document.getElementById('previewBio').innerHTML = `<i class="fas fa-quote-left"></i> ${escapeHtml(bio.substring(0, 150))}`;
      document.getElementById('previewLocation').innerHTML = `<i class="fas fa-map-marker-alt"></i> <span>${escapeHtml(location)}</span>`;
    }

    async function uploadAvatar(file) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${currentUser.id}_${Date.now()}.${fileExt}`;
      const filePath = fileName;
      
      // Check file size (max 2MB)
      if (file.size > 2 * 1024 * 1024) {
        throw new Error('File size must be less than 2MB');
      }
      
      const { error: uploadError } = await _supabase.storage
        .from('avatars')
        .upload(filePath, file);
      
      if (uploadError) throw uploadError;
      
      const { data: { publicUrl } } = _supabase.storage
        .from('avatars')
        .getPublicUrl(filePath);
      
      return publicUrl;
    }

    document.getElementById('avatarInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      if (!file.type.startsWith('image/')) {
        showMessage('Please select an image file', 'error');
        return;
      }
      
      showMessage('Uploading avatar...', 'info');
      
      try {
        const publicUrl = await uploadAvatar(file);
        currentAvatarUrl = publicUrl;
        
        document.getElementById('avatarImg').src = publicUrl;
        document.getElementById('avatarImg').style.display = 'block';
        document.getElementById('avatarIcon').style.display = 'none';
        
        document.getElementById('previewAvatarImg').src = publicUrl;
        document.getElementById('previewAvatarImg').style.display = 'block';
        document.getElementById('previewAvatarIcon').style.display = 'none';
        
        showMessage('Avatar uploaded! Click Save to apply changes.', 'success');
      } catch (error) {
        showMessage('Error uploading avatar: ' + error.message, 'error');
      }
    });

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const displayName = document.getElementById('displayName').value;
      let username = document.getElementById('username').value;
      const bio = document.getElementById('bio').value;
      const location = document.getElementById('location').value;
      
      // Validate username
      if (!/^[a-z0-9_]+$/.test(username.toLowerCase())) {
        showMessage('Username can only contain lowercase letters, numbers, and underscores', 'error');
        return;
      }
      
      if (bio.length > 150) {
        showMessage('Bio must be less than 150 characters', 'error');
        return;
      }
      
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
      
      const updateData = {
        display_name: displayName,
        username: username.toLowerCase(),
        bio: bio,
        location: location,
      };
      
      if (currentAvatarUrl) {
        updateData.avatar_url = currentAvatarUrl;
      }
      
      const { error } = await _supabase
        .from('profiles')
        .update(updateData)
        .eq('id', currentUser.id);
      
      if (error) {
        showMessage('Error updating profile: ' + error.message, 'error');
      } else {
        showMessage('✓ Profile updated successfully!', 'success');
        updatePreview();
      }
      
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
    });

    document.getElementById('displayName').addEventListener('input', updatePreview);
    document.getElementById('username').addEventListener('input', updatePreview);
    document.getElementById('bio').addEventListener('input', updatePreview);
    document.getElementById('location').addEventListener('input', updatePreview);

    function goBack() {
      window.location.href = 'home.html';
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function init() {
      await checkAuth();
      if (currentUser) {
        await loadProfile();
      }
    }

    init();
  </script>
</body>
</html>
