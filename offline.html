<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zerøbyte | Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    
    .offline-container {
      text-align: center;
      max-width: 400px;
    }
    
    .offline-icon {
      font-size: 80px;
      margin-bottom: 30px;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    p {
      color: #94a3b8;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .retry-btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .features-list {
      margin-top: 40px;
      text-align: left;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
    }
    
    .features-list h3 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #cbd5e1;
    }
    
    .features-list li {
      color: #94a3b8;
      margin-bottom: 10px;
      list-style: none;
      padding-left: 25px;
      position: relative;
    }
    
    .features-list li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>Don't worry! You can still read your previous messages. They'll send automatically when you're back online.</p>
    <button class="retry-btn" onclick="location.reload()">Try Again</button>
    <div class="features-list">
      <h3>What you can do offline:</h3>
      <ul>
        <li>Read all previous messages</li>
        <li>Browse your friends list</li>
        <li>View your profile</li>
        <li>Type messages (send when online)</li>
      </ul>
    </div>
  </div>
</body>
</html>
