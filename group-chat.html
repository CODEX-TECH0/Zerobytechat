<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#3B82F6">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="zerøbyte">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/3B82F6/white?text=ZB">
  
  <title>zerøbyte | Group Chats</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F0F9FF;
      color: #1E293B;
      padding-bottom: 75px;
    }
    .header {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(59,130,246,0.1);
    }
    .header h1 { font-size: 28px; background: linear-gradient(135deg, #3B82F6, #06B6D4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .header-actions { display: flex; gap: 20px; align-items: center; }
    .header-actions i { font-size: 20px; color: #64748B; cursor: pointer; }
    .create-group-btn {
      background: linear-gradient(135deg, #3B82F6, #06B6D4);
      color: white; border: none; padding: 10px 20px; border-radius: 40px;
      font-weight: 600; cursor: pointer; margin: 15px; width: calc(100% - 30px);
    }
    .groups-list { padding: 15px; }
    .group-card {
      display: flex; align-items: center; gap: 15px; padding: 15px;
      background: white; border-radius: 20px; margin-bottom: 10px;
      cursor: pointer; transition: all 0.2s; border: 1px solid #E2E8F0;
    }
    .group-card:hover { background: #F8FAFC; transform: translateX(5px); }
    .group-avatar {
      width: 55px; height: 55px; border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #06B6D4);
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .group-info { flex: 1; }
    .group-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .group-members { font-size: 12px; color: #64748B; }
    .empty-state { text-align: center; padding: 60px; color: #94A3B8; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(20px);
      display: flex; justify-content: space-around; padding: 12px 20px;
      border-top: 1px solid rgba(59,130,246,0.1); z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #94A3B8; cursor: pointer; font-size: 11px;
      padding: 6px 16px; border-radius: 30px;
    }
    .nav-item i { font-size: 22px; }
    .nav-item:hover, .nav-item.active { color: #3B82F6; background: rgba(59,130,246,0.1); }
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 200;
    }
    .modal-content {
      background: white; padding: 25px; border-radius: 28px; width: 90%; max-width: 400px;
    }
    .modal-content input {
      width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #E2E8F0; border-radius: 16px;
    }
    .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
    .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 16px; cursor: pointer; }
    .btn-confirm { background: #3B82F6; color: white; }
    .btn-cancel { background: #E2E8F0; color: #1E293B; }
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #22C55E; color: white; padding: 10px 20px; border-radius: 50px;
      font-size: 14px; z-index: 1000; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Group Chats</h1>
    <div class="header-actions"><i class="fas fa-search" onclick="location.href='search.html'"></i></div>
  </div>
  <button class="create-group-btn" onclick="openCreateModal()"><i class="fas fa-plus"></i> New Group</button>
  <div class="groups-list" id="groupsList"><div class="empty-state">Loading groups...</div></div>
  <div id="createGroupModal" class="modal"><div class="modal-content"><h3>Create New Group</h3><input type="text" id="groupName" placeholder="Group Name"><div class="modal-buttons"><button class="btn-confirm" onclick="createGroup()">Create</button><button class="btn-cancel" onclick="closeModal()">Cancel</button></div></div></div>
  <div id="toast" class="toast"></div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Feed</span></div>
    <div class="nav-item" onclick="location.href='chats.html'"><i class="fas fa-comments"></i><span>Chats</span></div>
    <div class="nav-item active" onclick="location.href='group-chat.html'"><i class="fas fa-users"></i><span>Groups</span></div>
    <div class="nav-item" onclick="location.href='profile.html'"><i class="fas fa-user"></i><span>Profile</span></div>
    <div class="nav-item" onclick="location.href='settings.html'"><i class="fas fa-cog"></i><span>Settings</span></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/service-worker.js'); }
    let currentUser = null;
    function showToast(msg, isErr) { const t = document.getElementById('toast'); t.textContent = msg; t.style.background = isErr ? '#EF4444' : '#22C55E'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
    async function checkAuth() { const { data: { session } } = await _supabase.auth.getSession(); if (!session) { location.href = 'login.html'; return null; } currentUser = session.user; return currentUser; }
    async function loadGroups() {
      try {
        const { data: memberships } = await _supabase.from('group_members').select('group_id').eq('user_id', currentUser.id);
        if (!memberships || memberships.length === 0) { document.getElementById('groupsList').innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><h3>No groups yet</h3><p>Create a group to chat with multiple friends!</p></div>'; return; }
        const groupIds = memberships.map(m => m.group_id);
        const { data: groups } = await _supabase.from('groups').select('*').in('id', groupIds);
        if (!groups || groups.length === 0) { document.getElementById('groupsList').innerHTML = '<div class="empty-state">No groups found</div>'; return; }
        let html = '';
        for (const group of groups) {
          const { count } = await _supabase.from('group_members').select('*', { count: 'exact', head: true }).eq('group_id', group.id);
          html += `<div class="group-card" onclick="openGroupChat('${group.id}', '${escapeHtml(group.name)}')"><div class="group-avatar"><i class="fas fa-users"></i></div><div class="group-info"><div class="group-name">${escapeHtml(group.name)}</div><div class="group-members"><i class="fas fa-user-friends"></i> ${count} members</div></div><i class="fas fa-chevron-right" style="color:#94A3B8"></i></div>`;
        }
        document.getElementById('groupsList').innerHTML = html;
      } catch(e) { console.error(e); document.getElementById('groupsList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error loading groups</h3><button onclick="location.reload()" style="margin-top:15px; padding:8px 20px; background:#3B82F6; color:white; border:none; border-radius:25px; cursor:pointer">Refresh</button></div>'; }
    }
    window.openCreateModal = () => { document.getElementById('groupName').value = ''; document.getElementById('createGroupModal').style.display = 'flex'; };
    window.closeModal = () => { document.getElementById('createGroupModal').style.display = 'none'; };
    window.createGroup = async () => {
      const name = document.getElementById('groupName').value.trim();
      if (!name) { showToast('Please enter a group name', true); return; }
      const btn = document.querySelector('#createGroupModal .btn-confirm');
      btn.disabled = true; btn.innerHTML = 'Creating...';
      try {
        const { data: group, error: gErr } = await _supabase.from('groups').insert([{ name, created_by: currentUser.id }]).select().single();
        if (gErr) throw gErr;
        await _supabase.from('group_members').insert([{ group_id: group.id, user_id: currentUser.id, role: 'admin' }]);
        showToast('Group created!'); closeModal(); await loadGroups();
      } catch(e) { showToast(e.message || 'Failed', true); } finally { btn.disabled = false; btn.innerHTML = 'Create'; }
    };
    window.openGroupChat = (id, name) => { localStorage.setItem('chatGroupId', id); localStorage.setItem('chatGroupName', name); location.href = 'group-messages.html'; };
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    async function init() { await checkAuth(); if (currentUser) await loadGroups(); }
    init();
  </script>
</body>
</html>
