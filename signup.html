<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Create your zerøbyte account. Join the real-time messaging platform and connect with friends instantly.">
  <meta name="robots" content="noindex, nofollow">
  <title>zerøbyte | Create Account - Sign Up for Free</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-container {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 45px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    .logo span {
      color: #22c55e;
      background: none;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #cbd5e1;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
    }

    label i {
      margin-right: 8px;
      color: #7c3aed;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
      color: #94a3b8;
    }

    .login-link a {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .message {
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: center;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .info {
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid #7c3aed;
      color: #7c3aed;
    }

    .password-strength {
      margin-top: 8px;
      font-size: 12px;
    }

    .strength-weak { color: #ef4444; }
    .strength-medium { color: #f59e0b; }
    .strength-strong { color: #22c55e; }

    @media (max-width: 640px) {
      .signup-container {
        padding: 30px 25px;
      }
      
      .logo {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <a href="index.html" class="logo">zerøbyte<span>.</span></a>
    <h2>Create Account</h2>
    <div class="subtitle">Join the fastest growing chat platform</div>
    
    <div id="message"></div>
    
    <form id="signupForm">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      
      <div class="form-group">
        <label><i class="fas fa-user"></i> Display Name</label>
        <input type="text" id="displayName" placeholder="How should we call you?" required autocomplete="name">
      </div>
      
      <div class="form-group">
        <label><i class="fas fa-at"></i> Username</label>
        <input type="text" id="username" placeholder="coolusername" required autocomplete="username">
        <div style="font-size: 11px; color: #64748b; margin-top: 5px;">Only lowercase letters and numbers</div>
      </div>
      
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
        <div class="password-strength" id="passwordStrength"></div>
      </div>
      
      <button type="submit" class="btn-primary" id="submitBtn">
        <i class="fas fa-user-plus"></i> Sign Up - It's Free
      </button>
    </form>
    
    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    
    function showMessage(text, type) {
      messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        messageDiv.innerHTML = '';
      }, 5000);
    }

    // Password strength checker
    document.getElementById('password').addEventListener('input', function(e) {
      const password = e.target.value;
      const strengthDiv = document.getElementById('passwordStrength');
      
      if (password.length === 0) {
        strengthDiv.innerHTML = '';
        return;
      }
      
      let strength = 'weak';
      let message = '';
      
      if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
        strength = 'strong';
        message = '✓ Strong password';
      } else if (password.length >= 6) {
        strength = 'medium';
        message = '⚠ Medium password - add numbers and uppercase letters';
      } else {
        strength = 'weak';
        message = '✗ Weak password - minimum 6 characters';
      }
      
      strengthDiv.innerHTML = `<span class="strength-${strength}">${message}</span>`;
    });

    function generateHandle(username) {
      const randomNum = Math.floor(Math.random() * 10000);
      return `${username}_${randomNum.toString().padStart(4, '0')}`;
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('displayName').value;
      let username = document.getElementById('username').value.toLowerCase();
      
      // Validate username (only letters, numbers, underscore)
      if (!/^[a-z0-9_]+$/.test(username)) {
        showMessage('Username can only contain lowercase letters, numbers, and underscores', 'error');
        return;
      }
      
      if (password.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
      
      try {
        const { data: authData, error: signUpError } = await _supabase.auth.signUp({
          email,
          password,
        });
        
        if (signUpError) throw signUpError;
        
        const userHandle = generateHandle(username);
        
        // Check if username is taken
        const { data: existingUser } = await _supabase
          .from('profiles')
          .select('username')
          .eq('username', username)
          .single();
        
        if (existingUser) {
          username = `${username}_${Math.floor(Math.random() * 1000)}`;
        }
        
        const { error: profileError } = await _supabase
          .from('profiles')
          .insert([{
            id: authData.user.id,
            email: email,
            display_name: displayName,
            username: username,
            user_handle: userHandle,
            is_online: true,
          }]);
        
        if (profileError) throw profileError;
        
        // Create notification settings for user
        await _supabase
          .from('notification_settings')
          .insert([{
            user_id: authData.user.id,
            email_on_message: true,
            email_on_friend_request: true,
            email_on_broadcast: true
          }]);
        
        showMessage('🎉 Account created successfully! Redirecting to dashboard...', 'success');
        
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 2000);
        
      } catch (error) {
        showMessage(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up - It\'s Free';
      }
    });
  </script>
</body>
</html>
