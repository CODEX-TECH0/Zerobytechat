<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Create your zerøbyte account">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%237c3aed'/%3E%3Ctext x='96' y='130' font-size='75' text-anchor='middle' fill='white' font-weight='bold'%3EZB%3C/text%3E%3C/svg%3E">
  <title>zerøbyte | Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .signup-container {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 45px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.5s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; font-size: 36px; font-weight: bold; margin-bottom: 30px; background: linear-gradient(135deg, #7c3aed, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; display: block; }
    h2 { text-align: center; margin-bottom: 10px; color: #cbd5e1; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
    label i { margin-right: 8px; color: #7c3aed; }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #7c3aed; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(124,58,237,0.4); }
    .login-link { text-align: center; margin-top: 25px; color: #94a3b8; }
    .login-link a { color: #7c3aed; text-decoration: none; }
    .message { padding: 14px; border-radius: 12px; margin-bottom: 25px; text-align: center; }
    .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
    .success { background: rgba(34,197,94,0.2); border: 1px solid #22c55e; color: #22c55e; }
    @media (max-width: 640px) { .signup-container { padding: 30px 25px; } }
  </style>
</head>
<body>
  <div class="signup-container">
    <a href="index.html" class="logo">zerøbyte<span style="color:#22c55e">.</span></a>
    <h2>Create Account</h2>
    <div class="subtitle">Join the fastest growing chat platform</div>
    <div id="message"></div>
    <form id="signupForm">
      <div class="form-group"><label><i class="fas fa-envelope"></i> Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label><i class="fas fa-user"></i> Display Name</label><input type="text" id="displayName" required></div>
      <div class="form-group"><label><i class="fas fa-at"></i> Username</label><input type="text" id="username" required></div>
      <div class="form-group"><label><i class="fas fa-lock"></i> Password (min 6 chars)</label><input type="password" id="password" minlength="6" required></div>
      <button type="submit" class="btn-primary">Sign Up</button>
    </form>
    <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const messageDiv = document.getElementById('message');
    function showMessage(text, type) { messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`; setTimeout(() => messageDiv.innerHTML = '', 5000); }
    function generateHandle(username) { return `${username}_${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`; }
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('displayName').value;
      let username = document.getElementById('username').value.toLowerCase();
      if (!/^[a-z0-9_]+$/.test(username)) { showMessage('Username: only lowercase letters, numbers, underscore', 'error'); return; }
      if (password.length < 6) { showMessage('Password must be at least 6 characters', 'error'); return; }
      try {
        const { data: authData, error: signUpError } = await _supabase.auth.signUp({ email, password });
        if (signUpError) throw signUpError;
        const userHandle = generateHandle(username);
        const { error: profileError } = await _supabase.from('profiles').insert([{ id: authData.user.id, email, display_name: displayName, username, user_handle: userHandle, is_online: true }]);
        if (profileError) throw profileError;
        await _supabase.from('notification_settings').insert([{ user_id: authData.user.id }]);
        showMessage('Account created! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'home.html', 2000);
      } catch (error) { showMessage(error.message, 'error'); }
    });
  </script>
</body>
</html>
