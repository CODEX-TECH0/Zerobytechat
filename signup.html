<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#3B82F6">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="zerøbyte">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/3B82F6/white?text=ZB">
  
  <title>zerøbyte | Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #3B82F6 0%, #06B6D4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .signup-container {
      background: white;
      border-radius: 40px;
      padding: 45px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; font-size: 32px; font-weight: bold; margin-bottom: 25px; background: linear-gradient(135deg, #3B82F6, #06B6D4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h2 { text-align: center; margin-bottom: 8px; color: #1E293B; }
    .subtitle { text-align: center; color: #64748B; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #1E293B; font-weight: 500; }
    label i { margin-right: 8px; color: #3B82F6; }
    input {
      width: 100%; padding: 14px 18px; background: #F8FAFC; border: 1.5px solid #E2E8F0;
      border-radius: 16px; color: #1E293B; font-size: 16px;
    }
    input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .btn-primary {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #3B82F6, #06B6D4);
      border: none; border-radius: 40px; color: white; font-size: 16px; font-weight: 600; cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(59,130,246,0.4); }
    .login-link { text-align: center; margin-top: 25px; color: #64748B; }
    .login-link a { color: #3B82F6; text-decoration: none; font-weight: 600; }
    .message { padding: 14px; border-radius: 16px; margin-bottom: 25px; text-align: center; }
    .error { background: #FEE2E2; border: 1px solid #EF4444; color: #DC2626; }
    .success { background: #DCFCE7; border: 1px solid #22C55E; color: #16A34A; }
    .loading { display: inline-block; width: 18px; height: 18px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="logo">zerøbyte</div>
    <h2>Create Account</h2>
    <div class="subtitle">Join the conversation today</div>
    <div id="message"></div>
    <form id="signupForm">
      <div class="form-group"><label><i class="fas fa-envelope"></i> Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label><i class="fas fa-user"></i> Display Name</label><input type="text" id="displayName" required></div>
      <div class="form-group"><label><i class="fas fa-at"></i> Username</label><input type="text" id="username" required></div>
      <div class="form-group"><label><i class="fas fa-lock"></i> Password (min 6)</label><input type="password" id="password" minlength="6" required></div>
      <button type="submit" class="btn-primary" id="signupBtn">Sign Up</button>
    </form>
    <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/service-worker.js'); }
    const msgDiv = document.getElementById('message'); const signupBtn = document.getElementById('signupBtn');
    function showMessage(text, type) { msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`; setTimeout(() => msgDiv.innerHTML = '', 5000); }
    function generateHandle(username) { return `${username}_${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`; }
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('displayName').value;
      const username = document.getElementById('username').value.toLowerCase();
      if (password.length < 6) { showMessage('Password must be at least 6 characters', 'error'); return; }
      signupBtn.disabled = true; signupBtn.innerHTML = '<span class="loading"></span> Creating account...';
      try {
        const { data: authData, error: signUpError } = await _supabase.auth.signUp({ email, password });
        if (signUpError) throw signUpError;
        const userHandle = generateHandle(username);
        await _supabase.from('profiles').insert([{ id: authData.user.id, email, display_name: displayName, username, user_handle: userHandle, is_online: true }]);
        await _supabase.from('user_settings').insert([{ user_id: authData.user.id }]);
        showMessage('Account created! Redirecting...', 'success');
        setTimeout(() => location.href = 'home.html', 2000);
      } catch (error) { showMessage(error.message, 'error'); signupBtn.disabled = false; signupBtn.innerHTML = 'Sign Up'; }
    });
  </script>
</body>
</html>
