<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%237c3aed'/%3E%3Ctext x='96' y='130' font-size='75' text-anchor='middle' fill='white' font-weight='bold'%3EZB%3C/text%3E%3C/svg%3E">
  <title>zerøbyte | Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
    }

    .chat-app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    /* Header - fixed at top */
    .chat-header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      flex-shrink: 0;
      z-index: 10;
    }

    .back-btn {
      background: rgba(124, 58, 237, 0.2);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: #7c3aed;
      font-size: 18px;
      cursor: pointer;
    }

    .friend-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .friend-info {
      flex: 1;
    }

    .friend-name {
      font-weight: bold;
      font-size: 17px;
    }

    .friend-status {
      font-size: 11px;
      color: #94a3b8;
    }

    .friend-status.online {
      color: #22c55e;
    }

    .chat-actions {
      display: flex;
      gap: 12px;
    }

    .chat-actions button {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    /* Messages area - scrollable, takes remaining space */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      display: flex;
      margin-bottom: 4px;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      justify-content: flex-end;
    }

    .message.received {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      word-wrap: break-word;
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background: rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 4px;
    }

    .message-text {
      font-size: 15px;
      line-height: 1.4;
    }

    .reply-preview {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 5px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .message-time {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      text-align: right;
    }

    .edited-badge {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      margin-left: 5px;
    }

    /* Input area - fixed at bottom */
    .chat-input-area {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 15px;
      display: flex;
      gap: 12px;
      border-top: 1px solid rgba(124, 58, 237, 0.2);
      flex-shrink: 0;
      z-index: 10;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 25px;
      color: white;
      font-size: 16px;
    }

    .chat-input:focus {
      outline: none;
      border-color: #7c3aed;
    }

    .btn-send {
      padding: 12px 24px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .replying-indicator {
      background: rgba(124, 58, 237, 0.2);
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Message Actions Menu */
    .message-actions-menu {
      position: fixed;
      background: #1e1b4b;
      border-radius: 12px;
      padding: 6px;
      display: none;
      gap: 5px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      border: 1px solid rgba(124,58,237,0.3);
    }

    .message-actions-menu button {
      background: none;
      border: none;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .message-actions-menu button:hover {
      background: rgba(124, 58, 237, 0.3);
    }

    .message-actions-menu button.delete {
      color: #ef4444;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1e1b4b;
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      border: 1px solid rgba(124,58,237,0.3);
    }

    .modal-content h3 {
      margin-bottom: 15px;
      color: #cbd5e1;
    }

    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid #7c3aed;
      border-radius: 10px;
      color: white;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-confirm {
      flex: 1;
      background: #7c3aed;
      border: none;
      padding: 10px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: #ef4444;
      border: none;
      padding: 10px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    .friend-list-item {
      padding: 12px;
      margin: 8px 0;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-result-item {
      padding: 10px;
      margin: 5px 0;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      cursor: pointer;
    }

    /* Notched phones support */
    @supports (padding: max(0px)) {
      .chat-header {
        padding-top: max(12px, env(safe-area-inset-top));
      }
      .chat-input-area {
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 640px) {
      .chat-header {
        padding: 10px 12px;
      }
      .chat-input-area {
        padding: 10px 12px;
      }
      .btn-send {
        padding: 10px 18px;
      }
      .message-bubble {
        max-width: 85%;
      }
      .message-actions-menu button {
        padding: 4px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
      <div class="friend-avatar" id="friendAvatar"><i class="fas fa-user"></i></div>
      <div class="friend-info">
        <div class="friend-name" id="friendName">Loading...</div>
        <div class="friend-status" id="friendStatus">Offline</div>
      </div>
      <div class="chat-actions">
        <button onclick="openSearchModal()"><i class="fas fa-search"></i></button>
        <button onclick="openPinnedModal()"><i class="fas fa-thumbtack"></i></button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div id="replyIndicator" class="replying-indicator" style="display:none">
      <span><i class="fas fa-reply"></i> Replying to: <span id="replyingToText"></span></span>
      <button onclick="cancelReply()" style="background:none; border:none; color:#ef4444; cursor:pointer">✕</button>
    </div>

    <div class="chat-input-area">
      <input type="text" class="chat-input" id="messageInput" placeholder="Type a message...">
      <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
    </div>
  </div>

  <!-- Modals -->
  <div id="editModal" class="modal"><div class="modal-content"><h3>Edit Message</h3><input type="text" id="editInput"><div class="modal-buttons"><button class="btn-confirm" onclick="confirmEdit()">Save</button><button class="btn-cancel" onclick="closeEditModal()">Cancel</button></div></div></div>
  <div id="forwardModal" class="modal"><div class="modal-content"><h3>Forward to...</h3><div id="friendsListForForward" style="max-height:300px; overflow-y:auto"></div><button class="btn-cancel" onclick="closeForwardModal()">Cancel</button></div></div>
  <div id="searchModal" class="modal"><div class="modal-content"><h3>Search Messages</h3><input type="text" id="searchQuery" placeholder="Type to search..."><button class="btn-confirm" onclick="searchMessages()">Search</button><div id="searchResults" style="margin-top:15px; max-height:300px; overflow-y:auto"></div><button class="btn-cancel" onclick="closeSearchModal()">Close</button></div></div>
  <div id="pinnedModal" class="modal"><div class="modal-content"><h3>Pinned Messages</h3><div id="pinnedList" style="max-height:300px; overflow-y:auto"></div><button class="btn-cancel" onclick="closePinnedModal()">Close</button></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let friendId = null;
    let messageCache = [];
    let replyingTo = null;
    let editingMessageId = null;
    let forwardingMessage = null;

    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return null; }
      currentUser = session.user;
      return currentUser;
    }

    function closeChat() { window.location.href = 'home.html'; }

    async function loadFriendInfo() {
      friendId = localStorage.getItem('chatFriendId');
      const friendName = localStorage.getItem('chatFriendName');
      if (!friendId) { closeChat(); return; }
      document.getElementById('friendName').textContent = friendName;
      const { data: friend } = await _supabase.from('profiles').select('is_online, avatar_url').eq('id', friendId).single();
      if (friend) {
        const statusEl = document.getElementById('friendStatus');
        if (friend.is_online) { statusEl.textContent = 'Online'; statusEl.classList.add('online'); }
        else { statusEl.textContent = 'Offline'; statusEl.classList.remove('online'); }
        if (friend.avatar_url) { document.getElementById('friendAvatar').innerHTML = `<img src="${friend.avatar_url}">`; }
      }
    }

    async function loadMessages() {
      const { data: messages } = await _supabase.from('messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`).order('created_at', { ascending: true });
      if (messages) {
        messageCache = messages;
        displayMessages();
        const unread = messages.filter(m => m.receiver_id === currentUser.id && !m.is_read);
        for (const msg of unread) { await _supabase.from('messages').update({ is_read: true }).eq('id', msg.id); }
      }
    }

    function displayMessages() {
      const container = document.getElementById('chatMessages');
      const shouldScroll = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
      container.innerHTML = '';
      for (const msg of messageCache) {
        const isSent = msg.sender_id === currentUser.id;
        const div = document.createElement('div');
        div.className = `message ${isSent ? 'sent' : 'received'}`;
        div.setAttribute('data-message-id', msg.id);
        const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        let replyHtml = '';
        if (msg.reply_to) { replyHtml = `<div class="reply-preview"><i class="fas fa-reply"></i> ${escapeHtml(msg.reply_to.substring(0, 50))}${msg.reply_to.length > 50 ? '...' : ''}</div>`; }
        div.innerHTML = `<div class="message-bubble" oncontextmenu="showMessageMenu(event, '${msg.id}', '${escapeHtml(msg.content)}', ${isSent})">${msg.is_pinned ? '<i class="fas fa-thumbtack" style="font-size:10px; margin-right:5px; color:#7c3aed"></i>' : ''}${replyHtml}<div class="message-text">${escapeHtml(msg.content)}</div><div class="message-time">${time}${msg.edited ? '<span class="edited-badge">edited</span>' : ''}${isSent ? `<span class="message-status">${msg.is_read ? '✓✓' : '✓'}</span>` : ''}</div></div>`;
        container.appendChild(div);
      }
      if (shouldScroll) { container.scrollTop = container.scrollHeight; }
    }

    function showMessageMenu(event, messageId, content, isSent) {
      event.preventDefault();
      const existing = document.querySelector('.message-actions-menu');
      if (existing) existing.remove();
      const menu = document.createElement('div');
      menu.className = 'message-actions-menu';
      menu.style.left = `${event.pageX - 80}px`;
      menu.style.top = `${event.pageY - 40}px`;
      let btns = '';
      if (isSent) { btns += `<button onclick="openEditModal('${messageId}', '${escapeHtml(content)}')"><i class="fas fa-edit"></i> Edit</button><button class="delete" onclick="deleteMessage('${messageId}', true)"><i class="fas fa-trash"></i> Delete for All</button><button class="delete" onclick="deleteMessage('${messageId}', false)"><i class="fas fa-user-slash"></i> Delete for Me</button>`; }
      btns += `<button onclick="pinMessage('${messageId}')"><i class="fas fa-thumbtack"></i> Pin</button><button onclick="startReply('${messageId}', '${escapeHtml(content)}')"><i class="fas fa-reply"></i> Reply</button><button onclick="openForwardModal('${messageId}', '${escapeHtml(content)}')"><i class="fas fa-share"></i> Forward</button>`;
      menu.innerHTML = btns;
      document.body.appendChild(menu);
      menu.style.display = 'flex';
      setTimeout(() => { document.addEventListener('click', function remove(e) { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', remove); } }); }, 10);
    }

    window.deleteMessage = async (id, all) => { if (all) { if (confirm('Delete for everyone?')) await _supabase.from('messages').delete().eq('id', id); } else { await _supabase.from('messages').update({ deleted_for: currentUser.id }).eq('id', id); } await loadMessages(); };
    window.openEditModal = (id, content) => { editingMessageId = id; document.getElementById('editInput').value = content; document.getElementById('editModal').style.display = 'flex'; };
    window.confirmEdit = async () => { const newContent = document.getElementById('editInput').value.trim(); if (newContent) { await _supabase.from('messages').update({ content: newContent, edited: true }).eq('id', editingMessageId); closeEditModal(); await loadMessages(); } };
    window.closeEditModal = () => { document.getElementById('editModal').style.display = 'none'; editingMessageId = null; };
    window.pinMessage = async (id) => { const msg = messageCache.find(m => m.id === id); await _supabase.from('messages').update({ is_pinned: !msg?.is_pinned }).eq('id', id); await loadMessages(); };
    window.startReply = (id, content) => { replyingTo = { id, content }; document.getElementById('replyingToText').textContent = content.substring(0, 50) + (content.length > 50 ? '...' : ''); document.getElementById('replyIndicator').style.display = 'flex'; };
    window.cancelReply = () => { replyingTo = null; document.getElementById('replyIndicator').style.display = 'none'; };
    window.openForwardModal = async (id, content) => {
      forwardingMessage = { id, content };
      const { data: conn } = await _supabase.from('connections').select('*').or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`).eq('status', 'accepted');
      const friendIds = conn.map(c => c.user_id === currentUser.id ? c.friend_id : c.user_id);
      const { data: friends } = await _supabase.from('profiles').select('id, display_name, username, avatar_url').in('id', friendIds);
      const container = document.getElementById('friendsListForForward');
      container.innerHTML = '';
      for (const f of friends || []) { container.innerHTML += `<div class="friend-list-item" onclick="forwardMessageTo('${f.id}')"><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center">${f.avatar_url ? `<img src="${f.avatar_url}" style="width:100%;height:100%;border-radius:50%">` : '<i class="fas fa-user"></i>'}</div><span>${escapeHtml(f.display_name || f.username)}</span></div>`; }
      document.getElementById('forwardModal').style.display = 'flex';
    };
    window.forwardMessageTo = async (targetId) => { await _supabase.from('messages').insert([{ sender_id: currentUser.id, receiver_id: targetId, content: `📨 Forwarded: ${forwardingMessage.content}`, is_read: false }]); closeForwardModal(); alert('Forwarded!'); };
    window.closeForwardModal = () => { document.getElementById('forwardModal').style.display = 'none'; forwardingMessage = null; };
    window.openSearchModal = () => { document.getElementById('searchModal').style.display = 'flex'; document.getElementById('searchResults').innerHTML = ''; document.getElementById('searchQuery').value = ''; };
    window.searchMessages = () => { const q = document.getElementById('searchQuery').value.toLowerCase(); const results = messageCache.filter(m => m.content.toLowerCase().includes(q)); const container = document.getElementById('searchResults'); if (results.length === 0) { container.innerHTML = '<p style="color:#94a3b8;text-align:center">No messages found</p>'; return; } container.innerHTML = results.map(m => `<div class="search-result-item" onclick="scrollToMessage('${m.id}')"><div style="font-size:11px;color:#7c3aed">${new Date(m.created_at).toLocaleString()}</div><div style="font-size:13px">${escapeHtml(m.content.substring(0, 80))}${m.content.length > 80 ? '...' : ''}</div></div>`).join(''); };
    function scrollToMessage(id) { const el = document.querySelector(`[data-message-id="${id}"]`); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.backgroundColor = 'rgba(124,58,237,0.3)'; setTimeout(() => el.style.backgroundColor = '', 2000); } closeSearchModal(); }
    window.closeSearchModal = () => { document.getElementById('searchModal').style.display = 'none'; };
    window.openPinnedModal = () => { const pinned = messageCache.filter(m => m.is_pinned); const container = document.getElementById('pinnedList'); if (pinned.length === 0) { container.innerHTML = '<p style="color:#94a3b8;text-align:center">No pinned messages</p>'; } else { container.innerHTML = pinned.map(m => `<div class="search-result-item" onclick="scrollToMessage('${m.id}')"><div style="font-size:11px;color:#7c3aed">${new Date(m.created_at).toLocaleString()}</div><div style="font-size:13px">${escapeHtml(m.content.substring(0, 80))}${m.content.length > 80 ? '...' : ''}</div></div>`).join(''); } document.getElementById('pinnedModal').style.display = 'flex'; };
    window.closePinnedModal = () => { document.getElementById('pinnedModal').style.display = 'none'; };
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content) return;
      const data = { sender_id: currentUser.id, receiver_id: friendId, content: content, is_read: false };
      if (replyingTo) { data.reply_to = replyingTo.content; data.reply_to_id = replyingTo.id; }
      await _supabase.from('messages').insert([data]);
      input.value = '';
      cancelReply();
      await loadMessages();
    }
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function setupRealtime() { _supabase.channel('chat-msgs').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadMessages()).subscribe(); }
    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    // FIXED: Auto-scroll when keyboard opens
    window.addEventListener('resize', () => { const c = document.getElementById('chatMessages'); if (c) c.scrollTop = c.scrollHeight; });
    document.getElementById('messageInput').addEventListener('focus', () => { setTimeout(() => { const c = document.getElementById('chatMessages'); if (c) c.scrollTop = c.scrollHeight; }, 300); });

    async function init() { await checkAuth(); if (currentUser) { await loadFriendInfo(); await loadMessages(); setupRealtime(); } }
    init();
  </script>
</body>
</html>
