<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Real-time private messaging on zerøbyte. Send messages, see typing indicators, and more.">
  <meta name="robots" content="noindex, nofollow">
  <title>zerøbyte | Chat - Real-time Messaging</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    /* Chat Header */
    .chat-header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      flex-shrink: 0;
    }

    .back-btn {
      background: rgba(124, 58, 237, 0.2);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: #7c3aed;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: #7c3aed;
      color: white;
    }

    .friend-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .friend-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .friend-info {
      flex: 1;
    }

    .friend-name {
      font-weight: bold;
      font-size: 18px;
    }

    .friend-status {
      font-size: 12px;
      color: #94a3b8;
    }

    .friend-status.online {
      color: #22c55e;
    }

    /* Chat Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      margin-bottom: 8px;
      animation: messageAppear 0.3s ease;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.sent {
      justify-content: flex-end;
    }

    .message.received {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 20px;
      position: relative;
      word-wrap: break-word;
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background: rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 4px;
    }

    .message-text {
      font-size: 15px;
      line-height: 1.4;
    }

    .message-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
      text-align: right;
    }

    .message-status {
      font-size: 10px;
      margin-left: 5px;
    }

    /* Typing Indicator */
    .typing-indicator {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      font-size: 12px;
      color: #94a3b8;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Chat Input */
    .chat-input-area {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      gap: 12px;
      border-top: 1px solid rgba(124, 58, 237, 0.2);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 30px;
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .chat-input:focus {
      outline: none;
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-send {
      padding: 12px 24px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-send:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
    }

    /* Report Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      padding: 30px;
      border-radius: 24px;
      max-width: 450px;
      width: 90%;
      border: 1px solid rgba(124, 58, 237, 0.3);
    }

    .modal-content h3 {
      margin-bottom: 15px;
      color: #cbd5e1;
    }

    .modal-content textarea {
      width: 100%;
      margin: 15px 0;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 12px;
      color: white;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-submit {
      flex: 1;
      background: #7c3aed;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-cancel {
      flex: 1;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 12px;
      border: 1px solid #ef4444;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Report Button on Messages */
    .report-btn {
      background: none;
      border: none;
      color: rgba(239, 68, 68, 0.6);
      cursor: pointer;
      font-size: 11px;
      margin-left: 8px;
      transition: color 0.3s ease;
    }

    .report-btn:hover {
      color: #ef4444;
    }

    /* Scrollbar */
    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #7c3aed;
      border-radius: 10px;
    }

    @media (max-width: 640px) {
      .message-bubble {
        max-width: 85%;
      }
      
      .chat-header {
        padding: 12px 15px;
      }
      
      .chat-input-area {
        padding: 12px 15px;
      }
      
      .btn-send {
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="friend-avatar" id="friendAvatar">
      <i class="fas fa-user"></i>
    </div>
    <div class="friend-info">
      <div class="friend-name" id="friendName">Loading...</div>
      <div class="friend-status" id="friendStatus">Offline</div>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-area">
    <input type="text" class="chat-input" id="messageInput" placeholder="Type a message...">
    <button class="btn-send" onclick="sendMessage()">
      <i class="fas fa-paper-plane"></i> Send
    </button>
  </div>

  <div id="reportModal" class="modal">
    <div class="modal-content">
      <h3><i class="fas fa-flag"></i> Report Message</h3>
      <p style="color:#94a3b8; font-size:13px;">Why are you reporting this message?</p>
      <textarea id="reportReason" rows="3" placeholder="Describe the issue..."></textarea>
      <div class="modal-buttons">
        <button class="btn-submit" onclick="submitReport()">Submit Report</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let friendId = null;
    let friendName = '';
    let messageSubscription = null;
    let typingTimeout = null;
    let currentReportMessageId = null;
    let currentReportContent = '';

    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return null;
      }
      currentUser = session.user;
      return currentUser;
    }

    function closeChat() {
      window.location.href = 'home.html';
    }

    async function loadFriendInfo() {
      friendId = localStorage.getItem('chatFriendId');
      friendName = localStorage.getItem('chatFriendName');
      
      if (!friendId) {
        closeChat();
        return;
      }
      
      document.getElementById('friendName').textContent = friendName;
      
      const { data: friend } = await _supabase
        .from('profiles')
        .select('is_online, avatar_url, display_name')
        .eq('id', friendId)
        .single();
      
      if (friend) {
        const statusEl = document.getElementById('friendStatus');
        if (friend.is_online) {
          statusEl.textContent = 'Online';
          statusEl.classList.add('online');
        } else {
          statusEl.textContent = 'Offline';
          statusEl.classList.remove('online');
        }
        
        if (friend.avatar_url) {
          document.getElementById('friendAvatar').innerHTML = `<img src="${friend.avatar_url}" alt="avatar">`;
        }
      }
    }

    async function loadMessages() {
      const { data: messages } = await _supabase
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });
      
      if (messages) {
        displayMessages(messages);
        
        // Mark unread messages as read
        const unreadMessages = messages.filter(m => m.receiver_id === currentUser.id && !m.is_read);
        for (const msg of unreadMessages) {
          await _supabase
            .from('messages')
            .update({ is_read: true })
            .eq('id', msg.id);
        }
      }
    }

    function displayMessages(messages) {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      
      for (const msg of messages) {
        const isSent = msg.sender_id === currentUser.id;
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
        
        const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        messageDiv.innerHTML = `
          <div class="message-bubble">
            <div class="message-text">${escapeHtml(msg.content)}</div>
            <div class="message-time">
              ${time}
              ${isSent ? `<span class="message-status">${msg.is_read ? '✓✓' : '✓'}</span>` : ''}
              ${!isSent ? `<button class="report-btn" onclick="openReportModal('${msg.id}', '${escapeHtml(msg.content)}')"><i class="fas fa-flag"></i> Report</button>` : ''}
            </div>
          </div>
        `;
        
        container.appendChild(messageDiv);
      }
      
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      
      if (!content) return;
      
      const { error } = await _supabase
        .from('messages')
        .insert([{
          sender_id: currentUser.id,
          receiver_id: friendId,
          content: content,
          is_read: false
        }]);
      
      if (!error) {
        input.value = '';
        await loadMessages();
      }
    }

    function setupRealtime() {
      if (messageSubscription) {
        messageSubscription.unsubscribe();
      }
      
      messageSubscription = _supabase
        .channel('messages-channel')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: `receiver_id=eq.${currentUser.id},sender_id=eq.${friendId}`
        }, () => {
          loadMessages();
        })
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: `sender_id=eq.${currentUser.id},receiver_id=eq.${friendId}`
        }, () => {
          loadMessages();
        })
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'messages'
        }, () => {
          loadMessages();
        })
        .subscribe();
    }

    window.openReportModal = (messageId, content) => {
      currentReportMessageId = messageId;
      currentReportContent = content;
      document.getElementById('reportReason').value = '';
      document.getElementById('reportModal').style.display = 'flex';
    };

    window.closeModal = () => {
      document.getElementById('reportModal').style.display = 'none';
      currentReportMessageId = null;
    };

    window.submitReport = async () => {
      const reason = document.getElementById('reportReason').value;
      
      if (!reason) {
        alert('Please provide a reason for reporting');
        return;
      }
      
      const { error } = await _supabase
        .from('reports')
        .insert([{
          message_id: currentReportMessageId,
          message_content: currentReportContent,
          reported_by: currentUser.id,
          reason: reason,
          status: 'pending'
        }]);
      
      if (error) {
        alert('Error reporting message: ' + error.message);
      } else {
        alert('✓ Message reported successfully! Admin will review it.');
        closeModal();
      }
    };

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function init() {
      await checkAuth();
      if (currentUser) {
        await loadFriendInfo();
        await loadMessages();
        setupRealtime();
      }
    }

    init();
  </script>
</body>
</html>
