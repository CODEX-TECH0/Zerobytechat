<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#3B82F6">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="zerøbyte">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/3B82F6/white?text=ZB">
  
  <title>zerøbyte | Edit Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F0F9FF;
      color: #1E293B;
      padding-bottom: 75px;
    }
    .header {
      background: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px;
      border-bottom: 1px solid #E2E8F0;
    }
    .back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #3B82F6; }
    .header h1 { font-size: 20px; }
    .form-section { background: white; margin: 15px; border-radius: 28px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: #1E293B; }
    input, textarea {
      width: 100%; padding: 12px; border: 1.5px solid #E2E8F0; border-radius: 16px;
      font-size: 16px; font-family: inherit; background: #F8FAFC;
    }
    input:focus, textarea:focus { outline: none; border-color: #3B82F6; }
    textarea { resize: vertical; min-height: 80px; }
    .save-btn { background: linear-gradient(135deg, #3B82F6, #06B6D4); color: white; border: none; padding: 14px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
    .avatar-section { text-align: center; margin-bottom: 20px; }
    .profile-avatar {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #06B6D4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px; cursor: pointer; overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-input { display: none; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(20px);
      display: flex; justify-content: space-around; padding: 12px 20px;
      border-top: 1px solid rgba(59,130,246,0.1); z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #94A3B8; cursor: pointer; font-size: 11px;
      padding: 6px 16px; border-radius: 30px;
    }
    .nav-item i { font-size: 22px; }
    .nav-item:hover, .nav-item.active { color: #3B82F6; background: rgba(59,130,246,0.1); }
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #1E293B; color: white; padding: 10px 20px; border-radius: 50px;
      font-size: 14px; z-index: 1000; display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='profile.html'"><i class="fas fa-arrow-left"></i></button>
    <h1>Edit Profile</h1>
  </div>
  <div id="toast" class="toast"></div>
  <div class="form-section">
    <div class="avatar-section">
      <div class="profile-avatar" onclick="document.getElementById('avatarInput').click()">
        <i class="fas fa-user" id="avatarIcon"></i><img id="avatarImg" style="display:none">
        <input type="file" id="avatarInput" class="avatar-input" accept="image/*">
      </div>
      <p style="font-size:12px; color:#64748B">Tap to change profile picture</p>
    </div>
    <div class="form-group"><label>Display Name</label><input type="text" id="displayName" placeholder="Your display name"></div>
    <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="username"></div>
    <div class="form-group"><label>Bio</label><textarea id="bio" placeholder="Tell something about yourself..."></textarea></div>
    <div class="form-group"><label>Location</label><input type="text" id="location" placeholder="City, Country"></div>
    <button class="save-btn" onclick="saveProfile()"><i class="fas fa-save"></i> Save Changes</button>
  </div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='home.html'"><i class="fas fa-home"></i><span>Feed</span></div>
    <div class="nav-item" onclick="location.href='chats.html'"><i class="fas fa-comments"></i><span>Chats</span></div>
    <div class="nav-item" onclick="location.href='group-chat.html'"><i class="fas fa-users"></i><span>Groups</span></div>
    <div class="nav-item active" onclick="location.href='profile.html'"><i class="fas fa-user"></i><span>Profile</span></div>
    <div class="nav-item" onclick="location.href='settings.html'"><i class="fas fa-cog"></i><span>Settings</span></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/service-worker.js'); }
    let currentUser = null;
    function showToast(msg, isErr) { const t = document.getElementById('toast'); t.textContent = msg; t.style.background = isErr ? '#EF4444' : '#1E293B'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
    async function checkAuth() { const { data: { session } } = await _supabase.auth.getSession(); if (!session) { location.href = 'login.html'; return null; } currentUser = session.user; return currentUser; }
    async function loadProfile() {
      const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
      if (data) {
        document.getElementById('displayName').value = data.display_name || '';
        document.getElementById('username').value = data.username || '';
        document.getElementById('bio').value = data.bio || '';
        document.getElementById('location').value = data.location || '';
        if (data.avatar_url) { document.getElementById('avatarImg').src = data.avatar_url; document.getElementById('avatarImg').style.display = 'block'; document.getElementById('avatarIcon').style.display = 'none'; }
      }
    }
    async function uploadAvatar(file) { const fn = `${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`; const { error } = await _supabase.storage.from('avatars').upload(fn, file); if (error) throw error; const { data: { publicUrl } } = _supabase.storage.from('avatars').getPublicUrl(fn); return publicUrl; }
    document.getElementById('avatarInput').addEventListener('change', async (e) => { const file = e.target.files[0]; if (!file) return; if (file.size > 2*1024*1024) { showToast('Image too large (max 2MB)', true); return; } try { const url = await uploadAvatar(file); document.getElementById('avatarImg').src = url; document.getElementById('avatarImg').style.display = 'block'; document.getElementById('avatarIcon').style.display = 'none'; showToast('Avatar uploaded! Save to apply'); } catch(err) { showToast('Upload failed', true); } });
    window.saveProfile = async () => {
      const displayName = document.getElementById('displayName').value;
      const username = document.getElementById('username').value.toLowerCase();
      const bio = document.getElementById('bio').value;
      const location = document.getElementById('location').value;
      if (!username) { showToast('Username required', true); return; }
      const updateData = { display_name: displayName, username, bio, location };
      const avatarImg = document.getElementById('avatarImg');
      if (avatarImg.style.display === 'block' && avatarImg.src && !avatarImg.src.includes('blob:')) updateData.avatar_url = avatarImg.src;
      const { error } = await _supabase.from('profiles').update(updateData).eq('id', currentUser.id);
      if (error) { showToast('Error: ' + error.message, true); } else { showToast('Profile updated!'); setTimeout(() => location.href = 'profile.html', 1500); }
    };
    async function init() { await checkAuth(); if (currentUser) await loadProfile(); }
    init();
  </script>
</body>
</html>
