<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%237c3aed'/%3E%3Ctext x='96' y='130' font-size='75' text-anchor='middle' fill='white' font-weight='bold'%3EZB%3C/text%3E%3C/svg%3E">
  <title>zerøbyte | Find Friends</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #ffffff;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; padding-bottom: 85px; }
    .header { display: flex; align-items: center; gap: 15px; padding: 15px 0; margin-bottom: 25px; border-bottom: 1px solid rgba(124,58,237,0.2); }
    .back-btn { background: rgba(124,58,237,0.2); border: none; width: 42px; height: 42px; border-radius: 50%; color: #7c3aed; cursor: pointer; }
    .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #7c3aed, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .search-section { background: rgba(15,23,42,0.7); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; margin-bottom: 25px; }
    .search-box { display: flex; gap: 12px; margin-bottom: 20px; }
    .search-input-wrapper { flex: 1; position: relative; }
    .search-input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }
    .search-input { width: 100%; padding: 14px 16px 14px 48px; background: rgba(255,255,255,0.1); border: 1px solid rgba(124,58,237,0.3); border-radius: 14px; color: white; font-size: 16px; }
    .search-btn { padding: 14px 28px; background: linear-gradient(135deg, #7c3aed, #a855f7); border: none; border-radius: 14px; color: white; font-weight: 600; cursor: pointer; }
    .suggestions { display: flex; gap: 10px; flex-wrap: wrap; }
    .suggestion-chip { background: rgba(124,58,237,0.15); padding: 8px 16px; border-radius: 30px; font-size: 13px; color: #7c3aed; cursor: pointer; }
    .results-section { background: rgba(15,23,42,0.7); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; min-height: 400px; }
    .results-header { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(124,58,237,0.2); }
    .results-count { background: rgba(124,58,237,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .user-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; margin-bottom: 12px; background: rgba(255,255,255,0.05); border-radius: 16px; transition: 0.1s; }
    .user-card:active { transform: scale(0.99); }
    .user-info { display: flex; align-items: center; gap: 15px; flex: 1; }
    .user-avatar { width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #a855f7); display: flex; align-items: center; justify-content: center; position: relative; }
    .user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .online-indicator { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #22c55e; border-radius: 50%; border: 2px solid #1e1b4b; }
    .action-buttons { display: flex; gap: 10px; }
    .btn-add { background: linear-gradient(135deg, #22c55e, #16a34a); border: none; padding: 8px 18px; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }
    .btn-pending { background: #64748b; border: none; padding: 8px 18px; border-radius: 12px; color: white; cursor: not-allowed; }
    .btn-friend { background: #7c3aed; border: none; padding: 8px 18px; border-radius: 12px; color: white; cursor: default; }
    .btn-chat { background: rgba(124,58,237,0.2); border: 1px solid #7c3aed; padding: 8px 18px; border-radius: 12px; color: #7c3aed; cursor: pointer; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; z-index: 1000; display: none; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,23,42,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 20px; border-top: 1px solid rgba(124,58,237,0.2); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #94a3b8; text-decoration: none; font-size: 11px; cursor: pointer; padding: 5px 15px; border-radius: 10px; }
    .nav-item:hover, .nav-item.active { color: #7c3aed; background: rgba(124,58,237,0.1); }
    @media (max-width: 640px) { .user-card { flex-direction: column; align-items: flex-start; gap: 12px; } .action-buttons { width: 100%; } .action-buttons button { flex: 1; } .search-box { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button><div class="logo">Find Friends</div></div>
    <div class="search-section">
      <div class="search-box"><div class="search-input-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" class="search-input" placeholder="Search by name or username..."></div><button class="search-btn" onclick="searchUsers()">Search</button></div>
      <div class="suggestions"><span class="suggestion-chip" onclick="quickSearch('trending')">🔥 Trending</span><span class="suggestion-chip" onclick="quickSearch('recent')">🕐 Recent</span><span class="suggestion-chip" onclick="quickSearch('online')">🟢 Online</span></div>
    </div>
    <div class="results-section"><div class="results-header"><span><i class="fas fa-users"></i> Results</span><span class="results-count" id="resultsCount">0 users</span></div><div id="resultsContainer"><div class="empty-state"><i class="fas fa-user-friends"></i><h4>Find Your People</h4><p>Search for friends to start connecting</p></div></div></div>
    <div class="bottom-nav"><div class="nav-item" onclick="window.location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></div><div class="nav-item" onclick="window.location.href='profile.html'"><i class="fas fa-user-edit"></i><span>Profile</span></div><div class="nav-item active"><i class="fas fa-search"></i><span>Find</span></div></div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null, searchTimeout = null;
    function showToast(msg, isError = false) { const t = document.getElementById('toast'); t.textContent = msg; t.style.background = isError ? '#ef4444' : '#22c55e'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
    async function checkAuth() { const { data: { session } } = await _supabase.auth.getSession(); if (!session) { window.location.href = 'login.html'; return null; } currentUser = session.user; return currentUser; }
    async function loadConnections() { const { data } = await _supabase.from('connections').select('*').or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`); return data || []; }
    function getStatus(connections, userId) {
      const conn = connections.find(c => c.user_id === userId || c.friend_id === userId);
      if (!conn) return 'none';
      if (conn.status === 'pending') return conn.user_id === currentUser.id ? 'pending_sent' : 'pending_received';
      if (conn.status === 'accepted') return 'friends';
      return 'none';
    }
    async function searchUsers() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;
      document.getElementById('resultsContainer').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Searching...</p></div>';
      let searchQuery = _supabase.from('profiles').select('*').neq('id', currentUser.id);
      if (query === 'trending') searchQuery = searchQuery.order('created_at', { ascending: false }).limit(20);
      else if (query === 'recent') searchQuery = searchQuery.order('created_at', { ascending: false }).limit(20);
      else if (query === 'online') searchQuery = searchQuery.eq('is_online', true).limit(20);
      else searchQuery = searchQuery.or(`display_name.ilike.%${query}%,username.ilike.%${query}%,email.ilike.%${query}%`).limit(30);
      const { data: users } = await searchQuery;
      const connections = await loadConnections();
      const container = document.getElementById('resultsContainer');
      document.getElementById('resultsCount').textContent = `${users?.length || 0} users`;
      if (!users || users.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><h4>No users found</h4></div>'; return; }
      let html = '';
      for (const user of users) {
        const status = getStatus(connections, user.id);
        let btn = '';
        if (status === 'none') btn = `<button class="btn-add" onclick="sendRequest('${user.id}')">Add Friend</button>`;
        else if (status === 'pending_sent') btn = `<button class="btn-pending" disabled>Request Sent</button>`;
        else if (status === 'pending_received') btn = `<button class="btn-add" onclick="acceptRequest('${user.id}')">Accept</button>`;
        else if (status === 'friends') btn = `<div style="display:flex;gap:6px"><button class="btn-friend" disabled>Friends</button><button class="btn-chat" onclick="startChat('${user.id}')">Chat</button></div>`;
        html += `<div class="user-card"><div class="user-info"><div class="user-avatar">${user.avatar_url ? `<img src="${user.avatar_url}">` : '<i class="fas fa-user"></i>'}${user.is_online ? '<span class="online-indicator"></span>' : ''}</div><div><strong>${escapeHtml(user.display_name || user.username)}</strong><div style="font-size:12px;color:#94a3b8">@${escapeHtml(user.user_handle || user.username)}</div></div></div><div class="action-buttons">${btn}</div></div>`;
      }
      container.innerHTML = html;
    }
    window.sendRequest = async (id) => { const { error } = await _supabase.from('connections').insert([{ user_id: currentUser.id, friend_id: id, status: 'pending' }]); if (error) showToast('Error', true); else { showToast('Request sent!'); searchUsers(); } };
    window.acceptRequest = async (id) => { await _supabase.from('connections').update({ status: 'accepted' }).eq('user_id', id).eq('friend_id', currentUser.id); showToast('Friend added!'); searchUsers(); };
    window.startChat = (id) => { localStorage.setItem('chatFriendId', id); window.location.href = 'chat.html'; };
    window.quickSearch = (type) => { document.getElementById('searchInput').value = type; searchUsers(); };
    function goBack() { window.location.href = 'home.html'; }
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    document.getElementById('searchInput').addEventListener('input', () => { if (searchTimeout) clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { if (document.getElementById('searchInput').value.trim()) searchUsers(); }, 300); });
    async function init() { await checkAuth(); if (currentUser) { } }
    init();
  </script>
</body>
</html>
