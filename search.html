<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Find and connect with friends on zerøbyte. Search by name, username, or email.">
  <meta name="robots" content="noindex, nofollow">
  <title>zerøbyte | Find Friends - Connect with People</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #ffffff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 85px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }

    .back-btn {
      background: rgba(124, 58, 237, 0.2);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #7c3aed;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: #7c3aed;
      color: white;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Search Section */
    .search-section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .search-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #cbd5e1;
    }

    .search-title i {
      color: #7c3aed;
      margin-right: 10px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-input-wrapper {
      flex: 1;
      position: relative;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 14px;
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.15);
    }

    .search-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
    }

    .suggestions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .suggestion-chip {
      background: rgba(124, 58, 237, 0.15);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      color: #7c3aed;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .suggestion-chip:hover {
      background: #7c3aed;
      color: white;
      transform: translateY(-2px);
    }

    /* Results Section */
    .results-section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px;
      min-height: 400px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }

    .results-title {
      font-size: 16px;
      color: #cbd5e1;
    }

    .results-count {
      background: rgba(124, 58, 237, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #7c3aed;
    }

    /* User Card */
    .user-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      transition: all 0.3s ease;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-card:hover {
      background: rgba(124, 58, 237, 0.1);
      transform: translateX(5px);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
    }

    .user-avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .online-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: #22c55e;
      border-radius: 50%;
      border: 2px solid #1e1b4b;
    }

    .user-details {
      flex: 1;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .user-handle {
      font-size: 12px;
      color: #94a3b8;
    }

    .user-bio {
      font-size: 12px;
      color: #64748b;
      margin-top: 5px;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-add {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-add:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
    }

    .btn-pending {
      background: #64748b;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: not-allowed;
    }

    .btn-friend {
      background: #7c3aed;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: default;
    }

    .btn-chat {
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid #7c3aed;
      padding: 10px 20px;
      border-radius: 12px;
      color: #7c3aed;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-chat:hover {
      background: #7c3aed;
      color: white;
    }

    .btn-accept-request {
      background: #22c55e;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-accept-request:hover {
      transform: scale(1.05);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state i {
      font-size: 64px;
      color: #7c3aed;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state h4 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #cbd5e1;
    }

    .empty-state p {
      color: #94a3b8;
    }

    /* Loading State */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 1000;
      animation: slideUp 0.3s ease;
      display: none;
      white-space: nowrap;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 12px 20px;
      border-top: 1px solid rgba(124, 58, 237, 0.2);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      transition: color 0.3s ease;
      cursor: pointer;
      padding: 5px 15px;
      border-radius: 10px;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item:hover, .nav-item.active {
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.1);
    }

    @media (max-width: 640px) {
      .container {
        padding: 15px;
        padding-bottom: 80px;
      }
      
      .user-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      
      .action-buttons {
        width: 100%;
      }
      
      .action-buttons button {
        flex: 1;
      }
      
      .search-box {
        flex-direction: column;
      }
      
      .toast {
        white-space: normal;
        text-align: center;
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="logo">Find Friends</div>
    </div>

    <div class="search-section">
      <div class="search-title">
        <i class="fas fa-search"></i> Discover People
      </div>
      
      <div class="search-box">
        <div class="search-input-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search by name, username, or email...">
        </div>
        <button class="search-btn" onclick="searchUsers()">
          <i class="fas fa-search"></i> Search
        </button>
      </div>
      
      <div class="suggestions">
        <span class="suggestion-chip" onclick="quickSearch('trending')"><i class="fas fa-fire"></i> Trending</span>
        <span class="suggestion-chip" onclick="quickSearch('recent')"><i class="fas fa-clock"></i> Recent</span>
        <span class="suggestion-chip" onclick="quickSearch('online')"><i class="fas fa-circle"></i> Online Now</span>
        <span class="suggestion-chip" onclick="quickSearch('nearby')"><i class="fas fa-map-marker-alt"></i> Nearby</span>
      </div>
    </div>

    <div class="results-section">
      <div class="results-header">
        <span class="results-title"><i class="fas fa-users"></i> Search Results</span>
        <span class="results-count" id="resultsCount">0 users</span>
      </div>
      <div id="resultsContainer">
        <div class="empty-state">
          <i class="fas fa-user-friends"></i>
          <h4>Find Your People</h4>
          <p>Search for friends by name or username to start connecting!</p>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='home.html'">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="window.location.href='profile.html'">
        <i class="fas fa-user-edit"></i>
        <span>Profile</span>
      </div>
      <div class="nav-item active">
        <i class="fas fa-search"></i>
        <span>Find</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let allConnections = [];

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.background = isError ? '#ef4444' : '#22c55e';
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return null;
      }
      currentUser = session.user;
      return currentUser;
    }

    async function loadConnections() {
      const { data } = await _supabase
        .from('connections')
        .select('*')
        .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);
      
      allConnections = data || [];
    }

    function getConnectionStatus(userId) {
      const connection = allConnections.find(c => 
        (c.user_id === userId || c.friend_id === userId)
      );
      
      if (!connection) return 'none';
      if (connection.status === 'pending') {
        return connection.user_id === currentUser.id ? 'pending_sent' : 'pending_received';
      }
      if (connection.status === 'accepted') return 'friends';
      return 'none';
    }

    async function searchUsers() {
      const query = document.getElementById('searchInput').value.trim();
      
      if (!query) {
        showToast('Please enter a search term', true);
        return;
      }
      
      showLoading();
      
      let searchQuery = _supabase
        .from('profiles')
        .select('*')
        .neq('id', currentUser.id);
      
      if (query === 'trending') {
        searchQuery = searchQuery.order('created_at', { ascending: false }).limit(20);
      } else if (query === 'recent') {
        searchQuery = searchQuery.order('created_at', { ascending: false }).limit(20);
      } else if (query === 'online') {
        searchQuery = searchQuery.eq('is_online', true).limit(20);
      } else if (query === 'nearby') {
        searchQuery = searchQuery.not('location', 'is', null).limit(20);
      } else {
        searchQuery = searchQuery.or(`display_name.ilike.%${query}%,username.ilike.%${query}%,email.ilike.%${query}%`);
      }
      
      const { data: users, error } = await searchQuery;
      
      if (error) {
        showToast('Error searching users', true);
        return;
      }
      
      displayResults(users || []);
    }

    function showLoading() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Searching for users...</p>
        </div>
      `;
    }

    function displayResults(users) {
      const container = document.getElementById('resultsContainer');
      const countSpan = document.getElementById('resultsCount');
      
      countSpan.textContent = `${users.length} ${users.length === 1 ? 'user' : 'users'}`;
      
      if (users.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-user-slash"></i>
            <h4>No Users Found</h4>
            <p>Try a different search term or check your spelling</p>
          </div>
        `;
        return;
      }
      
      let html = '';
      for (const user of users) {
        const status = getConnectionStatus(user.id);
        let buttonHtml = '';
        
        if (status === 'none') {
          buttonHtml = `<button class="btn-add" onclick="sendFriendRequest('${user.id}')">
                          <i class="fas fa-user-plus"></i> Add Friend
                        </button>`;
        } else if (status === 'pending_sent') {
          buttonHtml = `<button class="btn-pending" disabled>
                          <i class="fas fa-clock"></i> Request Sent
                        </button>`;
        } else if (status === 'pending_received') {
          buttonHtml = `<button class="btn-accept-request" onclick="acceptFriendRequest('${user.id}')">
                          <i class="fas fa-check"></i> Accept Request
                        </button>`;
        } else if (status === 'friends') {
          buttonHtml = `
            <div style="display:flex; gap:8px">
              <button class="btn-friend" disabled>
                <i class="fas fa-check-circle"></i> Friends
              </button>
              <button class="btn-chat" onclick="startChat('${user.id}', '${escapeHtml(user.display_name || user.username)}')">
                <i class="fas fa-comment"></i> Chat
              </button>
            </div>
          `;
        }
        
        html += `
          <div class="user-card">
            <div class="user-info">
              <div class="user-avatar">
                ${user.avatar_url ? `<img src="${user.avatar_url}" alt="avatar">` : '<i class="fas fa-user"></i>'}
                ${user.is_online ? '<span class="online-indicator"></span>' : ''}
              </div>
              <div class="user-details">
                <div class="user-name">
                  <strong>${escapeHtml(user.display_name || user.username)}</strong>
                  ${user.is_online ? '<span style="color:#22c55e; font-size:10px"><i class="fas fa-circle"></i> Online</span>' : ''}
                </div>
                <div class="user-handle">@${escapeHtml(user.user_handle || user.username)}</div>
                ${user.bio ? `<div class="user-bio">${escapeHtml(user.bio.substring(0, 80))}${user.bio.length > 80 ? '...' : ''}</div>` : ''}
              </div>
            </div>
            <div class="action-buttons">
              ${buttonHtml}
            </div>
          </div>
        `;
      }
      
      container.innerHTML = html;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.sendFriendRequest = async (friendId) => {
      const { error } = await _supabase
        .from('connections')
        .insert([{
          user_id: currentUser.id,
          friend_id: friendId,
          status: 'pending'
        }]);
      
      if (error) {
        showToast('Error sending request: ' + error.message, true);
      } else {
        showToast('✓ Friend request sent!');
        await loadConnections();
        searchUsers();
      }
    };

    window.acceptFriendRequest = async (userId) => {
      const { error } = await _supabase
        .from('connections')
        .update({ status: 'accepted' })
        .eq('user_id', userId)
        .eq('friend_id', currentUser.id);
      
      if (error) {
        showToast('Error accepting request', true);
      } else {
        showToast('✓ Friend request accepted!');
        await loadConnections();
        searchUsers();
      }
    };

    window.startChat = (friendId, friendName) => {
      localStorage.setItem('chatFriendId', friendId);
      localStorage.setItem('chatFriendName', friendName);
      window.location.href = 'chat.html';
    };

    window.quickSearch = (type) => {
      document.getElementById('searchInput').value = type;
      searchUsers();
    };

    function goBack() {
      window.location.href = 'home.html';
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchUsers();
    });

    async function init() {
      await checkAuth();
      if (currentUser) {
        await loadConnections();
        document.getElementById('searchInput').value = '';
      }
    }

    init();
  </script>
</body>
</html>
