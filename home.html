<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Your zerøbyte dashboard - View messages, friends, and notifications all in one place.">
  <meta name="robots" content="noindex, nofollow">
  <title>zerøbyte | Dashboard - Your Messages & Friends</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #ffffff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 85px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .top-actions {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .notification-bell {
      position: relative;
      cursor: pointer;
      font-size: 22px;
      color: #94a3b8;
      transition: color 0.3s ease;
    }

    .notification-bell:hover {
      color: #7c3aed;
    }

    .notification-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .btn-logout:hover {
      background: #ef4444;
      color: white;
    }

    /* Notifications Panel */
    .notifications-panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(20px);
      z-index: 1001;
      transition: right 0.3s ease;
      box-shadow: -5px 0 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .notifications-panel.open {
      right: 0;
    }

    .notifications-header {
      padding: 20px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notifications-header h3 {
      font-size: 20px;
    }

    .close-panel {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 28px;
      cursor: pointer;
    }

    .notifications-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .notification-item {
      background: rgba(124, 58, 237, 0.1);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .notification-item:hover {
      background: rgba(124, 58, 237, 0.2);
      transform: translateX(-3px);
    }

    .notification-item.unread {
      border-left: 3px solid #7c3aed;
      background: rgba(124, 58, 237, 0.15);
    }

    .notification-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .notification-message {
      font-size: 13px;
      color: #94a3b8;
    }

    .notification-time {
      font-size: 10px;
      color: #64748b;
      margin-top: 8px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    /* Profile Card */
    .profile-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
      border: 1px solid rgba(124, 58, 237, 0.2);
    }

    .avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info h3 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .profile-info p {
      color: #94a3b8;
      font-size: 14px;
    }

    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(124, 58, 237, 0.2);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: #7c3aed;
    }

    .stat-card i {
      font-size: 28px;
      color: #7c3aed;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 5px;
    }

    /* Sections */
    .section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.15);
      cursor: pointer;
      transition: background 0.3s ease;
      border-radius: 12px;
    }

    .user-item:hover {
      background: rgba(124, 58, 237, 0.15);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .request-actions {
      display: flex;
      gap: 10px;
    }

    .btn-accept, .btn-reject {
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-accept {
      background: #22c55e;
      color: white;
    }

    .btn-accept:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

    .btn-reject {
      background: #ef4444;
      color: white;
    }

    .btn-reject:hover {
      background: #dc2626;
      transform: scale(1.05);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
    }

    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 5px #22c55e;
    }

    .online-badge {
      font-size: 11px;
      color: #22c55e;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 12px 20px;
      border-top: 1px solid rgba(124, 58, 237, 0.2);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      transition: color 0.3s ease;
      cursor: pointer;
      padding: 5px 15px;
      border-radius: 10px;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item:hover, .nav-item.active {
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.1);
    }

    @media (max-width: 640px) {
      .container {
        padding: 15px;
        padding-bottom: 80px;
      }
      
      .profile-card {
        padding: 18px;
        gap: 15px;
      }
      
      .avatar {
        width: 65px;
        height: 65px;
        font-size: 28px;
      }
      
      .profile-info h3 {
        font-size: 18px;
      }
      
      .stat-number {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="logo">zerøbyte</div>
      <div class="top-actions">
        <div class="notification-bell" onclick="toggleNotifications()">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" id="notificationBadge" style="display:none">0</span>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Notifications Panel -->
    <div class="overlay" id="overlay" onclick="closeNotifications()"></div>
    <div class="notifications-panel" id="notificationsPanel">
      <div class="notifications-header">
        <h3><i class="fas fa-bell"></i> Notifications</h3>
        <button class="close-panel" onclick="closeNotifications()">&times;</button>
      </div>
      <div class="notifications-list" id="notificationsList">
        <div class="empty-state">No notifications yet</div>
      </div>
    </div>

    <!-- Profile Card -->
    <div class="profile-card" id="profileCard">
      <div class="avatar" id="avatarContainer">
        <i class="fas fa-user" id="avatarIcon"></i>
        <img id="avatarImg" style="display:none">
      </div>
      <div class="profile-info">
        <h3 id="displayName">Loading...</h3>
        <p id="userHandle">@loading</p>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="stats-row">
      <div class="stat-card" onclick="scrollToSection('friends')">
        <i class="fas fa-users"></i>
        <div class="stat-number" id="friendsCount">0</div>
        <div class="stat-label">Friends</div>
      </div>
      <div class="stat-card" onclick="scrollToSection('requests')">
        <i class="fas fa-user-plus"></i>
        <div class="stat-number" id="requestsCount">0</div>
        <div class="stat-label">Requests</div>
      </div>
      <div class="stat-card" onclick="scrollToSection('online')">
        <i class="fas fa-circle"></i>
        <div class="stat-number" id="onlineCount">0</div>
        <div class="stat-label">Online</div>
      </div>
      <div class="stat-card">
        <i class="fas fa-envelope"></i>
        <div class="stat-number" id="unreadCount">0</div>
        <div class="stat-label">Unread</div>
      </div>
    </div>

    <!-- Online Users Section -->
    <div class="section" id="onlineSection">
      <div class="section-title">
        <span><i class="fas fa-circle" style="color:#22c55e; font-size:12px"></i> Online Now</span>
        <span style="font-size:12px; cursor:pointer; color:#7c3aed" onclick="viewAllOnline()">View All →</span>
      </div>
      <div id="onlineUsersList"></div>
    </div>

    <!-- Friend Requests Section -->
    <div class="section" id="requestsSection">
      <div class="section-title">
        <span><i class="fas fa-user-plus"></i> Friend Requests</span>
      </div>
      <div id="requestsList"></div>
    </div>

    <!-- Friends Section -->
    <div class="section" id="friendsSection">
      <div class="section-title">
        <span><i class="fas fa-users"></i> My Friends</span>
      </div>
      <div id="friendsList"></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="window.location.href='home.html'">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="window.location.href='profile.html'">
        <i class="fas fa-user-edit"></i>
        <span>Profile</span>
      </div>
      <div class="nav-item" onclick="window.location.href='search.html'">
        <i class="fas fa-search"></i>
        <span>Find</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let friendsList = [];

    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return null;
      }
      currentUser = session.user;
      await _supabase.from('profiles').update({ is_online: true, last_seen: new Date() }).eq('id', currentUser.id);
      return currentUser;
    }

    async function loadProfile() {
      const { data } = await _supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      
      if (data) {
        document.getElementById('displayName').textContent = data.display_name || data.username;
        document.getElementById('userHandle').textContent = `@${data.user_handle || data.username}`;
        
        if (data.avatar_url) {
          document.getElementById('avatarImg').src = data.avatar_url;
          document.getElementById('avatarImg').style.display = 'block';
          document.getElementById('avatarIcon').style.display = 'none';
        }
      }
    }

    async function loadOnlineUsers() {
      const { data } = await _supabase
        .from('profiles')
        .select('id, display_name, username, user_handle, avatar_url')
        .eq('is_online', true)
        .neq('id', currentUser.id)
        .limit(8);
      
      const onlineCount = data?.length || 0;
      document.getElementById('onlineCount').textContent = onlineCount;
      
      const container = document.getElementById('onlineUsersList');
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state">No users online right now</div>';
        return;
      }
      
      let html = '';
      for (const user of data.slice(0, 5)) {
        html += `
          <div class="user-item" onclick="startChat('${user.id}', '${escapeHtml(user.display_name || user.username)}')">
            <div class="user-info">
              <div class="user-avatar">
                ${user.avatar_url ? `<img src="${user.avatar_url}">` : '<i class="fas fa-user"></i>'}
              </div>
              <div>
                <strong>${escapeHtml(user.display_name || user.username)}</strong>
                <div style="font-size:12px; color:#94a3b8">@${escapeHtml(user.user_handle || user.username)}</div>
              </div>
            </div>
            <span class="online-badge"><i class="fas fa-circle" style="font-size:8px"></i> Online</span>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    async function loadFriendRequests() {
      const { data: requests } = await _supabase
        .from('connections')
        .select('user_id')
        .eq('friend_id', currentUser.id)
        .eq('status', 'pending');
      
      const container = document.getElementById('requestsList');
      
      if (!requests || requests.length === 0) {
        container.innerHTML = '<div class="empty-state">No pending friend requests</div>';
        return;
      }
      
      document.getElementById('requestsCount').textContent = requests.length;
      
      let html = '';
      for (const req of requests) {
        const { data: user } = await _supabase
          .from('profiles')
          .select('*')
          .eq('id', req.user_id)
          .single();
        
        if (user) {
          html += `
            <div class="user-item">
              <div class="user-info">
                <div class="user-avatar">
                  ${user.avatar_url ? `<img src="${user.avatar_url}">` : '<i class="fas fa-user"></i>'}
                </div>
                <div>
                  <strong>${escapeHtml(user.display_name || user.username)}</strong>
                  <div style="font-size:12px; color:#94a3b8">@${escapeHtml(user.user_handle || user.username)}</div>
                </div>
              </div>
              <div class="request-actions">
                <button class="btn-accept" onclick="acceptRequest('${user.id}')">Accept</button>
                <button class="btn-reject" onclick="rejectRequest('${user.id}')">Reject</button>
              </div>
            </div>
          `;
        }
      }
      container.innerHTML = html;
    }

    async function loadFriends() {
      const { data: connections } = await _supabase
        .from('connections')
        .select('*')
        .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');
      
      const container = document.getElementById('friendsList');
      
      if (!connections || connections.length === 0) {
        container.innerHTML = '<div class="empty-state">No friends yet. Search for friends to connect!</div>';
        return;
      }
      
      friendsList = [];
      let html = '';
      
      for (const conn of connections) {
        const friendId = conn.user_id === currentUser.id ? conn.friend_id : conn.user_id;
        const { data: friend } = await _supabase
          .from('profiles')
          .select('*')
          .eq('id', friendId)
          .single();
        
        if (friend) {
          friendsList.push(friend);
          html += `
            <div class="user-item" onclick="startChat('${friend.id}', '${escapeHtml(friend.display_name || friend.username)}')">
              <div class="user-info">
                <div class="user-avatar">
                  ${friend.avatar_url ? `<img src="${friend.avatar_url}">` : '<i class="fas fa-user"></i>'}
                </div>
                <div>
                  <strong>${escapeHtml(friend.display_name || friend.username)}</strong>
                  <div style="font-size:12px; color:#94a3b8">@${escapeHtml(friend.user_handle || friend.username)}</div>
                </div>
              </div>
              <div class="status-dot ${friend.is_online ? 'online' : ''}"></div>
            </div>
          `;
        }
      }
      container.innerHTML = html;
      document.getElementById('friendsCount').textContent = friendsList.length;
    }

    async function loadUnreadCount() {
      const { data: unread } = await _supabase
        .from('messages')
        .select('id')
        .eq('receiver_id', currentUser.id)
        .eq('is_read', false);
      
      document.getElementById('unreadCount').textContent = unread?.length || 0;
    }

    async function loadNotifications() {
      const { data: userNotifs } = await _supabase
        .from('user_notifications')
        .select('notification_id, is_read')
        .eq('user_id', currentUser.id);
      
      const notifIds = userNotifs?.map(n => n.notification_id) || [];
      
      let notifications = [];
      if (notifIds.length > 0) {
        const { data: notifs } = await _supabase
          .from('notifications')
          .select('*')
          .in('id', notifIds)
          .order('created_at', { ascending: false });
        notifications = notifs || [];
      }
      
      const unreadCount = userNotifs?.filter(n => !n.is_read).length || 0;
      const badge = document.getElementById('notificationBadge');
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
      
      const container = document.getElementById('notificationsList');
      if (notifications.length === 0) {
        container.innerHTML = '<div class="empty-state">✨ No notifications yet</div>';
        return;
      }
      
      let html = '';
      for (const notif of notifications) {
        const userNotif = userNotifs?.find(n => n.notification_id === notif.id);
        const priorityIcon = notif.priority === 'urgent' ? '🔴' : notif.priority === 'high' ? '🟠' : '🔵';
        html += `
          <div class="notification-item ${!userNotif?.is_read ? 'unread' : ''}" onclick="markNotificationRead('${notif.id}')">
            <div class="notification-title">${priorityIcon} ${escapeHtml(notif.title)}</div>
            <div class="notification-message">${escapeHtml(notif.message)}</div>
            <div class="notification-time">${new Date(notif.created_at).toLocaleString()}</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    window.markNotificationRead = async (notificationId) => {
      await _supabase
        .from('user_notifications')
        .update({ is_read: true, read_at: new Date() })
        .eq('user_id', currentUser.id)
        .eq('notification_id', notificationId);
      
      loadNotifications();
    };

    window.toggleNotifications = () => {
      document.getElementById('notificationsPanel').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
      loadNotifications();
    };

    window.closeNotifications = () => {
      document.getElementById('notificationsPanel').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    };

    window.acceptRequest = async (userId) => {
      await _supabase
        .from('connections')
        .update({ status: 'accepted' })
        .eq('user_id', userId)
        .eq('friend_id', currentUser.id);
      
      loadFriendRequests();
      loadFriends();
    };

    window.rejectRequest = async (userId) => {
      await _supabase
        .from('connections')
        .delete()
        .eq('user_id', userId)
        .eq('friend_id', currentUser.id);
      
      loadFriendRequests();
    };

    window.startChat = (friendId, friendName) => {
      localStorage.setItem('chatFriendId', friendId);
      localStorage.setItem('chatFriendName', friendName);
      window.location.href = 'chat.html';
    };

    window.scrollToSection = (section) => {
      const element = document.getElementById(`${section}Section`);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    window.viewAllOnline = () => {
      alert(`Online users count: ${document.getElementById('onlineCount').textContent}`);
    };

    window.logout = async () => {
      await _supabase.from('profiles').update({ is_online: false }).eq('id', currentUser.id);
      await _supabase.auth.signOut();
      window.location.href = 'index.html';
    };

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setupRealtime() {
      // Subscribe to notifications
      _supabase
        .channel('notifications-channel')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'user_notifications',
          filter: `user_id=eq.${currentUser.id}`
        }, () => {
          loadNotifications();
        })
        .subscribe();
      
      // Subscribe to online status changes
      _supabase
        .channel('online-status')
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'profiles'
        }, () => {
          loadOnlineUsers();
          loadFriends();
        })
        .subscribe();
      
      // Subscribe to new messages
      _supabase
        .channel('messages-channel')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: `receiver_id=eq.${currentUser.id}`
        }, () => {
          loadUnreadCount();
          loadNotifications();
        })
        .subscribe();
    }

    async function init() {
      await checkAuth();
      if (currentUser) {
        await loadProfile();
        await loadOnlineUsers();
        await loadFriendRequests();
        await loadFriends();
        await loadUnreadCount();
        await loadNotifications();
        setupRealtime();
        
        // Refresh every 30 seconds
        setInterval(() => {
          loadOnlineUsers();
          loadUnreadCount();
        }, 30000);
      }
    }

    init();
  </script>
</body>
</html>
